name: Validate and Build WordPress Plugin

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Validate PHP syntax
        run: |
          find . \
            -type f \
            -name "*.php" \
            -not -path "./build/*" \
            -not -path "./.git/*" \
            -print0 | xargs -0 -n1 php -l

  build-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create plugin folder
        run: |
          mkdir -p build/solar-rights-search
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='*.zip' \
            ./ build/solar-rights-search/

      - name: Create ZIP
        run: |
          cd build
          zip -r ../solar-rights-search-${GITHUB_REF_NAME}.zip solar-rights-search

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: solar-rights-search-${{ github.ref_name }}.zip
          generate_release_notes: true